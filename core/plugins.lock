# Plugins, installed natively in every agent that can install them. One per line, tab-separated: plugin name, GitHub
# owner/repo, and space-separated <agent>=<how> entries (an agent without an entry gets the plugin's skills as vendored
# copies, see core/skills.lock). Versions are not kept here: each machine installs the version approved on it
# (state/approved.json, see docs/reference.md#updates), and nothing auto-updates.
#   claude=<plugin>@<marketplace>  Claude Code plugin id, the one the author recommends. The marketplace is added from the
#                                  plugin's repo (claude-plugins-official: Anthropic's), always with auto-update off.
#   codex=<plugin>@<marketplace>   Codex plugin id. The marketplace is a local catalog the installer writes in
#                                  build/codex-marketplaces/<marketplace>/ that pins the plugin to the approved commit.
#   antigravity=github             agy plugin install from the vendor checkout of the repo at the approved commit.
# A core/skills.lock entry from the same repo is a copy of the plugin: an agent that has the plugin natively does not get it.
superpowers	obra/superpowers	claude=superpowers@claude-plugins-official codex=superpowers@superpowers antigravity=github
taste-skill	Leonxlnx/taste-skill	claude=taste-skill@taste-skill codex=taste-skill@taste-skill
gsap-skills	greensock/gsap-skills	claude=gsap-skills@gsap-skills codex=gsap-skills@gsap-skills
harness	revfactory/harness	claude=harness@harness-marketplace codex=harness@harness-marketplace
