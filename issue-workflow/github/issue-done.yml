# Copy to .github/workflows/issue-done.yml
# When a PR is merged into the repo's default branch, close the linked issues and add the "done" label.
name: issue-done

on:
  pull_request:
    types: [closed]

permissions:
  issues: write
  pull-requests: read

jobs:
  issue-done:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Close linked issues and add done label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          BODY=$PR_BODY
          BRANCH=$HEAD_REF
          # --- extract-issues begin ---
          issues=$(
            {
              printf '%s\n' "$BODY" | grep -oiE '(^|[^[:alnum:]_/])(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]*#[0-9]+' | grep -oE '#[0-9]+$' | tr -d '#' || true
              printf '%s\n' "$BRANCH" | sed -nE 's#^[a-z]+/([0-9]+)-.*#\1#p'
            } | sort -nu
          )
          # --- extract-issues end ---
          if [ -z "$issues" ]; then
            echo "::notice::No linked issues found in PR body or branch name"
            exit 0
          fi
          gh label create done --color 0E8A16 --description "Merged into the default branch" 2>/dev/null || true
          for n in $issues; do
            echo "Issue #$n"
            gh issue edit "$n" --add-label done || echo "::warning::Could not add done label to issue #$n"
            gh issue close "$n" --reason completed || echo "::warning::Could not close issue #$n (missing or already closed)"
          done
